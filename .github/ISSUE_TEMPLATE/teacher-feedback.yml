name: Teacher feedback / pilot note
description: Tell us how a lesson went
labels: [feedback, needs-teacher-review]
body:
  - type: input
    id: unit
    attributes: {label: "Grade and unit"}
    validations: {required: true}
  - type: textarea
    id: worked
    attributes: {label: "What worked?"}
  - type: textarea
    id: confused
    attributes: {label: "What confused students? What did you change?"}
  - type: input
    id: time
    attributes: {label: "Time taken vs planned"}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I included no names or other personal details about students
          required: true
