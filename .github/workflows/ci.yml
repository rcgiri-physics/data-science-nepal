name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ipykernel install --user --name python3
      - name: Dataset cards have verified licences
        run: python tools/validate_dataset_cards.py
      - name: Units are complete
        run: python tools/check_units.py
      - name: Notebooks run top to bottom offline
        run: python tools/check_notebooks.py
