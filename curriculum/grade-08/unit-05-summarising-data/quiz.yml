unit: grade-08/unit-05
title: Summarising data
pre_post: true
questions:
- id: q1
  lesson: 1
  type: short
  question: Mean of 20, 20, 30, 40, 90?
  answer: 200 ÷ 5 = 40.
- id: q2
  lesson: 1
  type: short
  question: Median of 20, 20, 30, 40, 90?
  answer: '30.'
- id: q3
  lesson: 1
  type: short
  question: Mode and range?
  answer: Mode 20; range 90 − 20 = 70.
- id: q4
  lesson: 2
  type: short
  question: 'Incomes: 9 × 15,000 and 1 × 300,000 — mean?'
  answer: (135,000 + 300,000) ÷ 10 = 43,500.
- id: q5
  lesson: 2
  type: short
  question: Median of the same list?
  answer: 15,000.
- id: q6
  lesson: 2
  type: short
  question: Which is more typical and why?
  answer: 'The median: the mean is pulled up by one outlier.'
- id: q7
  lesson: 3
  type: short
  question: Mean of class A (7, 8, 8, 9)?
  answer: '8.'
- id: q8
  lesson: 3
  type: short
  question: Mean and range of class B (5, 6, 10, 11)?
  answer: Mean 8; range 6.
- id: q9
  lesson: 3
  type: short
  question: What do these tell us that the means alone do not?
  answer: B is much more spread out.
