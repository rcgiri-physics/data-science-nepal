unit: grade-12/unit-05
title: Fairness and bias audit
pre_post: true
questions:
- id: q1
  lesson: 1
  type: short
  question: Name two sources of bias.
  answer: e.g. unrepresentative data; labels reflecting past unfairness; measurement differences.
- id: q2
  lesson: 1
  type: short
  question: Is bias only a coding problem?
  answer: 'No: it begins with data and decisions.'
- id: q3
  lesson: 1
  type: short
  question: Who should be involved in checking?
  answer: Affected communities as well as technical people.
- id: q4
  lesson: 2
  type: short
  question: Why show group sizes?
  answer: Small groups make estimates noisy.
- id: q5
  lesson: 2
  type: short
  question: Selection rate is…
  answer: The share predicted 'yes' in a group.
- id: q6
  lesson: 2
  type: short
  question: What gap matters most?
  answer: The one linked to the harm of the decision.
- id: q7
  lesson: 3
  type: short
  question: Can you always 'fix' bias with a tweak?
  answer: 'No: sometimes the answer is not to use the model.'
- id: q8
  lesson: 3
  type: short
  question: Why keep humans in the loop?
  answer: To catch errors and take responsibility.
- id: q9
  lesson: 3
  type: short
  question: What must the memo include?
  answer: Findings, limits and recommendations.
