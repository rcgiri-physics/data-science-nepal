unit: grade-12/unit-07
title: Communicating with data
pre_post: true
questions:
- id: q1
  lesson: 1
  type: short
  question: What is an action title?
  answer: A title that states the finding.
- id: q2
  lesson: 1
  type: short
  question: What goes in the caption?
  answer: Source, units and a limit.
- id: q3
  lesson: 1
  type: short
  question: Why a zero baseline for bars?
  answer: Otherwise differences look exaggerated.
- id: q4
  lesson: 2
  type: short
  question: What goes first?
  answer: The bottom line.
- id: q5
  lesson: 2
  type: short
  question: Why say what you don't know?
  answer: It builds trust and helps decisions.
- id: q6
  lesson: 2
  type: short
  question: Who is your audience?
  answer: A specific decision-maker, not 'everyone'.
- id: q7
  lesson: 3
  type: short
  question: How to show uncertainty plainly?
  answer: Use a range and a sentence like 'likely between X and Y'.
- id: q8
  lesson: 3
  type: short
  question: What do you publish with data work?
  answer: Licence, credits, source, limits.
- id: q9
  lesson: 3
  type: short
  question: Is Django required?
  answer: 'No: optional stretch.'
