unit: grade-10/unit-06
title: AI literacy and ethics
pre_post: true
questions:
- id: q1
  lesson: 1
  type: short
  question: What does an AI learn from?
  answer: Training data (examples).
- id: q2
  lesson: 1
  type: short
  question: Does it understand like a person?
  answer: 'No: it predicts patterns.'
- id: q3
  lesson: 1
  type: short
  question: What happens with bad data?
  answer: Bad or biased predictions.
- id: q4
  lesson: 2
  type: short
  question: What is hallucination?
  answer: A confident but false or invented output.
- id: q5
  lesson: 2
  type: short
  question: How do you check?
  answer: Compare with the original source.
- id: q6
  lesson: 2
  type: short
  question: Give a source of bias.
  answer: Training data that under-represents some groups.
- id: q7
  lesson: 3
  type: short
  question: What does 'explain, don't answer' mean?
  answer: Ask for explanations, then do the work yourself.
- id: q8
  lesson: 3
  type: short
  question: What must you never paste into a tool?
  answer: Private personal data about real people.
- id: q9
  lesson: 3
  type: short
  question: Why an oral check?
  answer: To show you understand your work.
