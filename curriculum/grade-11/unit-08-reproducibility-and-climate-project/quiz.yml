unit: grade-11/unit-08
title: Reproducibility, Git and the climate project
pre_post: true
questions:
- id: q1
  lesson: 1
  type: short
  question: What does git commit record?
  answer: A snapshot with a message.
- id: q2
  lesson: 1
  type: short
  question: Why write clear messages?
  answer: So you know what and why later.
- id: q3
  lesson: 1
  type: short
  question: Which command shows changes waiting?
  answer: git status.
- id: q4
  lesson: 2
  type: short
  question: Why set a seed?
  answer: So random results can be repeated.
- id: q5
  lesson: 2
  type: short
  question: What else affects reproducibility?
  answer: Library/Python versions and data versions.
- id: q6
  lesson: 2
  type: short
  question: Does a seed make a result correct?
  answer: 'No: only repeatable.'
- id: q7
  lesson: 3
  type: short
  question: What proves it is reproducible?
  answer: Someone else reruns it and gets the same results.
- id: q8
  lesson: 3
  type: short
  question: What goes in the limits?
  answer: Synthetic data, one series, short period, weather vs climate.
- id: q9
  lesson: 3
  type: short
  question: What do you disclose?
  answer: AI help used, data licence and source.
